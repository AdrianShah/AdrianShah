name: Update Tech Stack Icons

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/skill-icons.json"
      - "config/skills-baseline.json"
      - "scripts/update_skills.js"

permissions:
  contents: write

concurrency:
  group: profile-readme-automation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh tech stack icons from repo languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update_skills.js

      - name: Commit & push
        run: scripts/commit_and_push.sh "chore: update tech stack icons" README.md
